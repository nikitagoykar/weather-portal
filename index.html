<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- links -->
  <link rel="icon" type="png" href="img/icon.png" />
  <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
  <link rel="stylesheet" href="css/style.css" />
  <!-- Title -->
  <title>Weather App</title>
</head>

<body>
<!-- Main App Container -->
<div id="screen" class="app-container">

  <!-- City / Header -->
  <div class="city-name header-glow">
    <i class="fa-solid fa-map-pin"></i>
    <h1 id="city-name">Mumbai</h1>
  </div>

  <!-- Weather Icon -->
  <div class="weather-icon-css">
    <img class="weather-icon" src="img/sun.png" alt="Weather Icon" />
  </div>

  <!-- Weather Details -->
  <div class="weather-description glass-card">
    <div class="show-metric" id="metric">0°</div>
    <div class="weather-details">
      <div class="weather-main" id="weather-main">Sunny</div>
      <div class="h-f">
        <div class="show-humidity">H: <span id="humidity">60</span></div>
        <span class="divider">|</span>
        <div class="show-humidity">F: <span id="feels-like">60</span></div>
      </div>
    </div>
  </div>

  <!-- Forecast Section -->
  <div class="forcasts-box">

    <!-- Today Forecast -->
    <div class="today-forecast fancy-card">
      <h4>TODAY</h4>
      <div class="weather-icon-today">
        <img class="weather-icons" src="img/sun.png" alt="Today Icon" />
      </div>
      <div class="temp-today">
        <span id="temp-min-today">50°</span>/<span id="temp-max-today">55°</span>
      </div>
      <div class="weather-main-today" id="weather-main">Sunny</div>
    </div>

    <!-- 6-Day Forecast -->
    <div class="future-forecast fancy-card">
      <h5>6-DAYS FORECAST</h5>
      <div id="future-forecast-box"></div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="bottom-nav">
    <ul>
      <li>
        <a class="active" href="index.html">
          <i class="fa-solid fa-location-arrow"></i>
        </a>
      </li>
      <li>
        <a href="search.html">
          <i class="fa-solid fa-magnifying-glass"></i>
        </a>
      </li>
      <li>
        <a href="world.html">
          <i class="fa-solid fa-earth-americas"></i>
        </a>
      </li>
    </ul>
  </nav>
</div>

<!-- Script -->
<script src="js/main.js"></script>
</body>
</html>
